
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">

        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
                         class="d-block w-100" alt="Phone">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1512499617640-c74ae3a79d37"
                         class="d-block w-100" alt="Technology">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab"
                         class="d-block w-100" alt="Smartphone">
                </div>

            </div>

            <button class="carousel-control-prev" type="button"
                data-bs-target="#myCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next" type="button"
                data-bs-target="#myCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
